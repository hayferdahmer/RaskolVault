# Валюты сервера «РАСКОЛ | ДВЕ КОРОНЫ»
# GLOBAL   — проксируется в EssentialsX (единственная: gold)
# NATIONAL — привязана к Towny-нации (резиденты получают автоматически)
# WORLD    — свободная валюта, не привязана к нациям

currencies:
  gold:
    display-name: "Золото"
    symbol: "⚜"
    type: GLOBAL
    decimals: 2
    tradeable: true

