# RaskolVault 1.1.0 — валюты сервера «РАСКОЛ | ДВЕ КОРОНЫ»
# ID валют = 3 буквы капсом. symbol = буквенный код (символы-глифы убраны).
# icon — предмет GUI (этап 1.1.0-d).
# ПРОВЕРЬ имена наций: /n list — nation-id должен совпадать с именем нации Towny
# (регистр не важен). Если нации называются иначе — правь nation-id здесь.

currencies:
  GLD:
    display-name: 'Золото'
    symbol: 'GLD'
    icon: GOLD_INGOT
    type: GLOBAL
    decimals: 2
    tradeable: true

  RAS:
    display-name: 'Динар Рассвета'
    symbol: 'RAS'
    icon: SUNFLOWER
    type: NATIONAL
    nation-id: rassvet
    decimals: 2
    tradeable: true

  VLR:
    display-name: 'Вальрадисская Крона'
    symbol: 'VLR'
    icon: GOLDEN_HELMET
    type: NATIONAL
    nation-id: valradis
    decimals: 2
    tradeable: true
