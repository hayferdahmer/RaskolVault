# RaskolVault 1.0.0 — валюты сервера «РАСКОЛ | ДВЕ КОРОНЫ»
#
# ПРАВИЛО ID: ровно 3 буквы капсом ([A-Z]{3}).
# Это требование бренда и совместимости с PAPI (%raskolvault_balance_<ID>%).
#
# GLOBAL   — единственная проксируемая в EssentialsX.
# NATIONAL — привязана к Towny-нации, создаётся автоматически при NewNationEvent
#            или вручную через /rv admin currency create.
# WORLD    — свободная валюта без привязки (опционально).

currencies:
  GLD:
    display-name: "Золото"
    symbol: "⚜"
    type: GLOBAL
    decimals: 2
    tradeable: true

  # Национальные валюты столиц (создадутся автоматически,
  # если имена наций в Towny = Rassvet и Valradis — ниже в nation-symbols)
  RAS:
    display-name: "Рассветный денарий"
    symbol: "☀"
    type: NATIONAL
    nation-id: rassvet
    decimals: 2
    tradeable: true

  VLR:
    display-name: "Вальрадисская крона"
    symbol: "☾"
    type: NATIONAL
    nation-id: valradis
    decimals: 2
    tradeable: true
