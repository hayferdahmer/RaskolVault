name: RaskolVault
version: '1.2.6'
main: dev.raskol.vault.RaskolVault
api-version: '1.21'
author: hayferdahmer
description: Многовалютное экономическое ядро: золотой стандарт, биржа, аукцион, банк, налоги.
website: https://github.com/hayferdahmer/RaskolVault

softdepend:
  - Essentials
  - Towny
  - LuckPerms
  - PlaceholderAPI
  - RaskolCore

commands:
  rv:
    description: Корневая команда RaskolVault
    usage: /rv <wallet|pay|convert|confirm|rates|exchange|auction|bank|cabinet|guide|admin>
    aliases: [raskolvault, rvault]
  raskolvault:
    description: Алиас корневой команды
    usage: /raskolvault <sub>
    aliases: []

permissions:
  raskolvault.use:
    description: Базовый доступ (кошелёк, переводы, обмен, ставки, кредиты)
    default: true
  raskolvault.convert:
    description: Конвертация валют
    default: true
  raskolvault.exchange:
    description: Биржа ордеров
    default: true
  raskolvault.auction:
    description: Аукцион (создание/ставки/покупка)
    default: true
  raskolvault.bank:
    description: Банк (вклады/кредиты)
    default: true
  raskolvault.cabinet:
    description: Кабинет правителя (только король/мэр)
    default: op
  raskolvault.admin:
    description: Полный админ-доступ
    default: op
    children:
      raskolvault.admin.view: true
      raskolvault.admin.currency: true
      raskolvault.admin.rates: true
      raskolvault.admin.give: true
      raskolvault.admin.take: true
      raskolvault.admin.set: true
      raskolvault.admin.mint: true
      raskolvault.admin.burn: true
      raskolvault.admin.audit: true
      raskolvault.admin.reload: true
      raskolvault.admin.backup: true
      raskolvault.admin.restore: true
      raskolvault.admin.health: true
      raskolvault.admin.auction: true
      raskolvault.admin.bank: true
