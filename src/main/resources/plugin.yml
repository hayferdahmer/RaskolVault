name: RaskolVault
version: '1.2.1'
main: dev.raskol.vault.RaskolVault
api-version: '1.21'
author: hayferdahmer
description: 'Многовалютный экономический слой поверх EssentialsX: национальные валюты с золотым покрытием, биржа королей, escrow, SQLite-аудит'

# RaskolVault стартует ПОСЛЕ зависимостей и ДО плагинов-друзей
softdepend: [RaskolCore, Vault, Essentials, Towny, LuckPerms, PlaceholderAPI, spark]
loadbefore: [RaskolMarket, RaskolCaravans, RaskolCharters, EconomyShopGUI, ChestShop]

commands:
  rv:
    description: 'Команды RaskolVault'
    usage: '/rv [help|wallet|pay|convert|confirm|rates|exchange|nation|admin]'
    aliases: [raskolvault, wallet]

permissions:
  raskolvault.use:
    description: 'Базовые команды кошелька (balance, pay, wallet)'
    default: true
  raskolvault.convert:
    description: 'Обмен валют'
    default: true
  raskolvault.exchange:
    description: 'Просмотр стакана биржи (ордера — только короли)'
    default: true
  raskolvault.admin:
    description: 'Все админские подкоманды'
    default: op
    children:
      raskolvault.admin.view: true
      raskolvault.admin.currency: true
      raskolvault.admin.rates: true
      raskolvault.admin.give: true
      raskolvault.admin.take: true
      raskolvault.admin.set: true
      raskolvault.admin.mint: true
      raskolvault.admin.burn: true
      raskolvault.admin.audit: true
      raskolvault.admin.reload: true
      raskolvault.admin.debug: true
      raskolvault.admin.backup: true
      raskolvault.admin.health: true
  raskolvault.api.use:
    description: 'Доступ к публичному API для плагинов-друзей'
    default: true
  raskolvault.api.admin:
    description: 'Админ-операции через API (без лимитов)'
    default: op
