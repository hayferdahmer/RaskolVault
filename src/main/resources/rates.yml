# RaskolVault 1.0.0 — курсы обмена валют
#
# Формат ключа: <from>_<to>  (lower-case, без пробелов).
# Обратная пара НЕ выводится автоматически — задаётся явно.
# Это осознанный антиарбитражный ход: gold_denarius=2.0 не означает denarius_gold=0.5.
#
# Курс = сколько единиц <to> получаешь за 1 единицу <from> ДО вычета комиссии.
# Комиссия списывается в <from>, остаток умножается на курс.
#
# Индивидуальные комиссии (секция fees) переопределяют default-fee из config.yml.

rates:
  # gold ↔ denarius (1:2)
  gold_denarius: 2.0
  denarius_gold: 0.45
  # gold ↔ crown (1:1.5)
  gold_crown: 1.5
  crown_gold: 0.6

fees:
  # Пример переопределения комиссии для пары gold_denarius (5% вместо 2%):
  # gold_denarius: 0.05
