# Курсы обмена. Ключи — пары трёхбуквенных ID: <FROM>_<TO> (обе части капсом).
# Обратная пара не выводится автоматически — задаётся явно (антиарбитраж).
# Курс = сколько единиц TO получаешь за 1 FROM (до комиссии).

rates:
  # GLD ↔ RAS (1 золотой = 2 денария)
  GLD_RAS: 2.0
  RAS_GLD: 0.45
  # GLD ↔ VLR (1 золотой = 1.5 кроны)
  GLD_VLR: 1.5
  VLR_GLD: 0.6
  # RAS ↔ VLR (прямой курс между нациями)
  RAS_VLR: 0.75
  VLR_RAS: 1.25

fees:
  # Индивидуальные комиссии переопределяют default-fee (2%) из config.yml
  # GLD_RAS: 0.03
