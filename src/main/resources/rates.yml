# RaskolVault rates.yml (1.1.3)
# rates: статические пары (справочно; движок использует цены резерва)
# fees: комиссии пар (база, сжигается). Дефолт = exchange.default-fee.
# embargo: закрытые пары (симметрично, обе стороны). Пример: - RAS_VLR

rates:
  GLD_RAS: 2.0
  GLD_VLR: 2.0
  RAS_VLR: 1.0

fees:
  RAS_VLR: 0.02
  GLD_RAS: 0.02
  GLD_VLR: 0.02

embargo: []
# Пример закрытия пары:
# embargo:
#   - RAS_VLR
