# RaskolVault — многовалютный экономический слой поверх EssentialsX
# для сервера «РАСКОЛ | ДВЕ КОРОНЫ»
#
# Фракции и столицы: Рассвет (Лайтрис) и Вальрадис (Драгос).
# Никакой семантики «свет/тьма» в коде нет — только точные ID наций Towny.

general:
  debug: false
  locale: ru
  # Резерв: интервал автосохранения кэша (записи в SQLite идут через писателя)
  auto-save-minutes: 5

# Глобальная валюта: проксируется в EssentialsX (⚜)
global-currency:
  id: GLD
  display-name: "Золото"
  symbol: "⚜"
  decimals: 2
  # Синхронизировать баланс gold с Essentials при старте и операциях
  essentials-sync: true

exchange:
  enabled: true
  # Комиссия по умолчанию для пары, если у пары нет своей в rates.yml (доля от суммы)
  default-fee: 0.02
  # Требовать явное подтверждение обмена командой /rv confirm
  require-confirm: true
  # Сколько секунд живёт ожидание подтверждения после /rv convert
  confirm-timeout-seconds: 30
  # Файл курсов обмена (формат ключей: <FROM>_<TO>)
  rates-file: rates.yml
  # Резерв (1.0.5): лимит обменов в секунду на игрока (анти-спам)
  rate-limit-per-second: 10

auto-convert:
  # Резерв: автоконвертация при /pay, если у плательщика другая валюта.
  # В 1.0.x выключено: переводы идут только в валюте получателя.
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    # Авто-создание национальной валюты при NewNationEvent
    auto-create-national: true
    # Точный символ на ID нации (lower-case от имени нации в Towny)
    nation-symbols:
      rassvet: "☀"
      valradis: "☾"
    # Символ для наций, не попавших в карту выше
    default-symbol: "¤"
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    # Регистрироваться провайдером в EconomyRegistry (вытесняет VaultEconomyProvider)
    register-as-provider: true
  placeholderapi:
    enabled: true

storage:
  sqlite:
    file: data/ledger.sqlite
    # 1.0.2: пул соединений (1..16). 5 хватает на 100+ онлайна с запасом.
    pool-size: 5
    # NORMAL — скорость (WAL защищает от краша процесса).
    # FULL — медленнее записи, но защищает от обрыва питания сервера.
    synchronous: NORMAL
    # Сколько мс ждать свободное соединение из пула до громкой ошибки;
    # в 1.0.3 это также таймаут join для синхронного пути (Core-хук, админки).
    borrow-timeout-ms: 5000
    # WAL-гигиена: PRAGMA wal_checkpoint(TRUNCATE) каждые N минут (0 = выключить)
    checkpoint-interval-minutes: 5
    # 1.0.3: ёмкость очереди писателя; при переполнении — backpressure
    # (запись выполняется синхронно на потоке вызывающего, без потери порядка)
    writer-queue-cap: 10000
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: "04:00"
    keep-days: 7

audit:
  # Резерв (1.0.4): дублирование аудита в отдельный лог-файл с ротацией
  log-to-file: true
  log-to-console: false
  rotation-mb: 5

messages:
  file: messages.yml
