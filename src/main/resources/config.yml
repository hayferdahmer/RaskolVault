# RaskolVault — многовалютный экономический слой поверх EssentialsX
# для сервера «РАСКОЛ | ДВЕ КОРОНЫ»

general:
  debug: false
  locale: ru
  auto-save-minutes: 5

global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: '⚜'
  decimals: 2
  essentials-sync: true

exchange:
  enabled: true
  default-fee: 0.02
  require-confirm: true
  confirm-timeout-seconds: 30
  rates-file: rates.yml
  rate-limit-per-second: 10

auto-convert:
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    register-as-provider: true
  placeholderapi:
    enabled: true

storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    checkpoint-interval-minutes: 5
    writer-queue-cap: 10000
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7

# 1.0.5: анти-дюп контур
security:
  rate-limit:
    # Token bucket на игрока для /rv pay и /rv convert (preview).
    # enabled: false или capacity: 0 = лимит выключен.
    enabled: true
    capacity: 8.0
    refill-per-second: 2.0
  inflation-check:
    # Почасовой чекпоинт инварианта SUM(balances) == SIGNSUM(transactions).
    # Аномалия = SEVERE в лог + %raskolvault_inflation_anomalies%.
    enabled: true
    interval-minutes: 60

audit:
  log-to-file: true
  log-to-console: false
  rotation-mb: 5

messages:
  file: messages.yml
