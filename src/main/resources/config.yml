# RaskolVault 1.1.0 — многовалютный экономический слой поверх EssentialsX
# «РАСКОЛ | ДВЕ КОРОНЫ»
# ВАЖНО: на живом сервере удали старый plugins/RaskolVault/config.yml на стопе —
# сгенерируется этот шаблон. Все ключи ниже уже являются дефолтами кода.

general:
  debug: false
  locale: ru
  auto-save-minutes: 5

global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: 'GLD'          # 1.1.0: символы заменены буквенными кодами
  decimals: 2
  essentials-sync: true

exchange:
  enabled: true
  default-fee: 0.02
  require-confirm: true
  confirm-timeout-seconds: 30
  rates-file: rates.yml
  rate-limit-per-second: 10

auto-convert:
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    register-as-provider: true
  placeholderapi:
    enabled: true

storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    checkpoint-interval-minutes: 5
    writer-queue-cap: 10000
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7

audit:
  log-to-file: true
  log-to-console: false
  rotation-mb: 5

messages:
  file: messages.yml
