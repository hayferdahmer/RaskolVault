# ============================================================
# RaskolVault 1.0.0 — Multi-currency economy layer
# over EssentialsX for RASKOL | TWO CROWNS
# ============================================================

general:
  debug: false
  locale: ru
  auto-save-minutes: 5

global-currency:
  id: gold
  display-name: "Золото"
  symbol: "⚜"
  decimals: 2
  essentials-sync: true

exchange:
  enabled: true
  default-fee: 0.02
  require-confirm: true
  rate-limit-per-second: 10

auto-convert:
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    register-as-provider: true
  placeholderapi:
    enabled: true

storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: "04:00"
    keep-days: 7

audit:
  log-to-file: true
  log-to-console: false
  rotation-mb: 5
