# RaskolVault 1.1.2 — многовалютный экономический слой поверх EssentialsX
# «РАСКОЛ | ДВЕ КОРОНЫ»

general:
  debug: false
  locale: ru
  auto-save-minutes: 5

global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: 'GLD'
  decimals: 2
  essentials-sync: true

exchange:
  enabled: true
  default-fee: 0.02
  require-confirm: true
  confirm-timeout-seconds: 30
  rates-file: rates.yml

auto-convert:
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    register-as-provider: true
  placeholderapi:
    enabled: true

reserve:
  coverage-floor: 0.5
  parity-min: 0.5
  parity-max: 2.0
  tax-max: 0.05
  withdraw-daily-share: 0.25
  check-interval-minutes: 60
  file: nations.yml
  # 1.1.2: сеньораж — доля эмиссии, сжигаемая в никуда при минте (антиинфляционный sink)
  seigniorage: 0.02
  bulletin:
    enabled: true
    interval-minutes: 10080   # 7 дней

safety:
  rate-limit:
    capacity: 5.0
    refill-per-second: 0.5

storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    checkpoint-interval-minutes: 5
    writer-queue-cap: 10000
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7

audit:
  log-to-file: true
  log-to-console: false
  rotation-mb: 5

messages:
  file: messages.yml
