# RaskolVault 1.1.0 — многовалютный экономический слой поверх EssentialsX
# «РАСКОЛ | ДВЕ КОРОНЫ»

general:
  debug: false
  locale: ru
  auto-save-minutes: 5

global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: 'GLD'
  decimals: 2
  essentials-sync: true

exchange:
  enabled: true
  # Базовая комиссия конвертации (сжигается). Налог нации-цели добавляется сверху.
  default-fee: 0.02
  require-confirm: true
  confirm-timeout-seconds: 30
  rates-file: rates.yml

# 1.1.0-b: Валютный совет (золотое покрытие национальных валют)
reserve:
  # Минимальное допустимое покрытие резервом. Ниже — кризис: цена падает до резерв/эмиссия.
  coverage-floor: 0.5
  # Границы паритета (официального курса нации к золоту).
  parity-min: 0.5
  parity-max: 2.0
  # Максимальный налог конвертации в валюту нации (доля от суммы).
  tax-max: 0.05
  # Доля резерва, которую король может вывести за сутки.
  withdraw-daily-share: 0.25
  # Период кризисного чекпоинта покрытия, минут.
  check-interval-minutes: 60
  # Файл паритета/налога наций.
  file: nations.yml

# 1.1.0-b: rate-limit конвертаций на игрока (token bucket)
safety:
  rate-limit:
    capacity: 5.0
    refill-per-second: 0.5

auto-convert:
  enabled: false
  require-confirm: true

hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  raskolcore:
    enabled: true
    register-as-provider: true
  placeholderapi:
    enabled: true

storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    checkpoint-interval-minutes: 5
    writer-queue-cap: 10000
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7

audit:
  log-to-file: true
  log-to-console: false
  rotation-mb: 5

messages:
  file: messages.yml
