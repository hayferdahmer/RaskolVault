# ============================================================
#  RaskolVault 1.2.6 — config.yml
#  Многовалютное экономическое ядро (Paper 1.21)
#  Сервер «РАСКОЛ | ДВЕ КОРОНЫ»
#
#  Все ставки — доли (0.02 = 2%). Время — минуты/мс, если не указано иное.
#  Строки с ':' , '|' , '<' берите в кавычки (требование YAML-валидатора CI).
# ============================================================

general:
  debug: false

# ------------------------------------------------------------
# ХРАНИЛИЩЕ (SQLite WAL + single-writer + yaml-бэкапы)
# ------------------------------------------------------------
storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    writer-queue-cap: 10000
    checkpoint-interval-minutes: 5
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7
  reconcile-interval-minutes: 30

# ------------------------------------------------------------
# СООБЩЕНИЯ
# ------------------------------------------------------------
messages:
  file: messages.yml

# ------------------------------------------------------------
# ГЛОБАЛЬНАЯ ВАЛЮТА (прокси в EssentialsX)
# ------------------------------------------------------------
global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: 'GLD'
  decimals: 2

# ------------------------------------------------------------
# ОБМЕН ВАЛЮТ
# ------------------------------------------------------------
exchange:
  default-fee: 0.02          # базовая комиссия обмена (сжигается)
  min-fee: 0.01              # пол комиссии (анти-dust)
  min-amount: 1.0            # минимальная сумма обмена
  confirm-timeout-seconds: 30
  rates-file: rates.yml

# ------------------------------------------------------------
# РЕЗЕРВ / ЗОЛОТОЙ СТАНДАРТ
#  Runtime-ключи reserve.parity.<нация> и reserve.tax.<нация>
#  пишет сам плагин — вручную не править.
# ------------------------------------------------------------
reserve:
  check-interval-minutes: 60
  coverage-floor: 0.5        # покрытие < 50% = КРИЗИС + broadcast
  parity-min: 0.5
  parity-max: 2.0
  tax-max: 0.05              # максимум налога нации (5%)
  withdraw-daily-share: 0.25 # лимит вывода из резерва в сутки (25%)
  seigniorage: 0.02          # сеньораж при минте (сжигается)

# ------------------------------------------------------------
# БЕЗОПАСНОСТЬ
# ------------------------------------------------------------
safety:
  rate-limit:                # конверты
    capacity: 5.0
    refill-per-second: 0.5
  pay-rate-limit:            # переводы
    capacity: 5.0
    refill-per-second: 0.5
  max-transaction: 1000000000  # анти-overflow кап любой операции

# ------------------------------------------------------------
# АУКЦИОН
# ------------------------------------------------------------
auction:
  listing-fee-rate: 0.01     # комиссия листинга (сжигается)
  listing-fee-min: 0.1
  sell-fee-rate: 0.03        # комиссия продажи
  max-duration-hours: 72
  max-lots-per-player: 10
  sounds-enabled: true
  chat-notify: true
  sniping-window-ms: 30000   # окно анти-снайпинга (ставка в последние 30 сек)
  sniping-extend-ms: 300000  # продление лота при снайпинге (+5 мин)
  blacklist-items:           # материалы, запрещённые к продаже
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - DEBUG_STICK

# ------------------------------------------------------------
# БАНК (вклады + кредиты двух типов)
#  Кредиты: UNSECURED (лимит по скору) и SECURED (залог >= ratio).
#  Деньги выдаются из пула вкладов (фракционное резервирование).
# ------------------------------------------------------------
bank:
  defaults:
    demand-rate: 0.01        # до востребования, годовых
    rate-7: 0.02
    rate-30: 0.035
    rate-90: 0.05
    loan-rate: 0.10          # базовая ставка кредита, годовых
    collateral-ratio: 1.2    # залог >= 120% суммы (обеспеченный кредит)
    reserve-multiplier: 3.0  # maxLoans = reserve × 3.0
    early-penalty: 0.02      # штраф досрочного закрытия вклада (% от тела)
    unsecured-base: 500      # базовый лимит необеспеченного кредита
    unsecured-per-score: 100 # + шаго за каждую единицу скорa
    unsecured-premium: 0.05  # надбавка к ставке необеспеченного
  accrual-interval-minutes: 60
  liquidation-check-minutes: 60
  appraisal:                 # оценка предметов залога (цена за 1 шт, GLD)
    DIAMOND: 100.0
    DIAMOND_BLOCK: 900.0
    NETHERITE_INGOT: 500.0
    GOLD_BLOCK: 90.0
    EMERALD: 60.0
    ENCHANTED_GOLDEN_APPLE: 250.0
  # Per-nation переопределения (опционально), пример:
  # nations:
  #   вальрадис:
  #     loan-rate: 0.08
  #     collateral-ratio: 1.1

# ------------------------------------------------------------
# АУДИТ / САМОДИАГНОСТИКА
# ------------------------------------------------------------
audit:
  interval-minutes: 60

# ------------------------------------------------------------
# ХУКИ
# ------------------------------------------------------------
hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true   # авто-создание нацвалюты при появлении нации
  luckperms:
    enabled: true
  placeholderapi:
    enabled: true
  raskolcore:
    register-as-provider: true
