# ============================================================
#  RaskolVault 1.2.6 — config.yml
#  Многовалютное экономическое ядро (Paper 1.21)
#  Все ставки — доли (0.02 = 2%). Время — минуты/мс, если не указано иное.
# ============================================================

general:
  debug: false

# ---------- Хранилище ----------
storage:
  sqlite:
    file: data/ledger.sqlite
    pool-size: 5
    synchronous: NORMAL
    borrow-timeout-ms: 5000
    writer-queue-cap: 10000
    checkpoint-interval-minutes: 5
  yaml-backup:
    enabled: true
    file: data/balances.yml
  daily-backup:
    enabled: true
    time: '04:00'
    keep-days: 7
  reconcile-interval-minutes: 30

# ---------- Сообщения ----------
messages:
  file: messages.yml

# ---------- Глобальная валюта ----------
global-currency:
  id: GLD
  display-name: 'Золото'
  symbol: 'GLD'
  decimals: 2

# ---------- Обмен ----------
exchange:
  default-fee: 0.02
  min-fee: 0.01
  min-amount: 1.0
  confirm-timeout-seconds: 30
  rates-file: rates.yml

# ---------- Резерв / золотой стандарт ----------
reserve:
  check-interval-minutes: 60
  coverage-floor: 0.5
  parity-min: 0.5
  parity-max: 2.0
  tax-max: 0.05
  withdraw-daily-share: 0.25
  seigniorage: 0.02

# ---------- Безопасность ----------
safety:
  rate-limit:
    capacity: 5.0
    refill-per-second: 0.5
  pay-rate-limit:
    capacity: 5.0
    refill-per-second: 0.5
  max-transaction: 1000000000

# ---------- Аукцион ----------
auction:
  listing-fee-rate: 0.01
  listing-fee-min: 0.1
  sell-fee-rate: 0.03
  max-duration-hours: 72
  max-lots-per-player: 10
  sounds-enabled: true
  chat-notify: true
  sniping-window-ms: 30000
  sniping-extend-ms: 300000
  blacklist-items:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - DEBUG_STICK

# ---------- Банк ----------
bank:
  defaults:
    demand-rate: 0.01
    rate-7: 0.02
    rate-30: 0.035
    rate-90: 0.05
    loan-rate: 0.10
    collateral-ratio: 1.5
    reserve-multiplier: 3.0
    early-penalty: 0.02
  accrual-interval-minutes: 60
  liquidation-check-minutes: 60
  appraisal:
    DIAMOND: 100.0
    DIAMOND_BLOCK: 900.0
    NETHERITE_INGOT: 500.0
    GOLD_BLOCK: 90.0
    EMERALD: 60.0
    ENCHANTED_GOLDEN_APPLE: 250.0

# ---------- Аудит ----------
audit:
  interval-minutes: 60

# ---------- Хуки ----------
hooks:
  essentials:
    enabled: true
  towny:
    enabled: true
    auto-create-national: true
  luckperms:
    enabled: true
  placeholderapi:
    enabled: true
  raskolcore:
    register-as-provider: true
