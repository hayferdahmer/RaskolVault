# RaskolVault 1.1.0 — строгий стиль сообщений.
# Префикс: тёмная рамка + золото, без глифов валют.
ru:
  prefix: '&8▌&6RaskolVault&8▌&7 '
  balance:
    header: '&6Кошелёк игрока {player}'
    line: '&7 {display}: &f{amount}'
    empty: '&7 Кошелёк пуст'
  pay:
    sent: '&aПереведено {amount} игроку {player}'
    received: '&aПолучено {amount} от {player}'
  convert:
    preview: '&6Обмен: &f{from} &7→ &f{to} &7| курс {rate} | комиссия {fee}'
    confirm-hint: '&7Подтверди: &6/rv confirm &7(30 сек)'
    done: '&aОбмен выполнен: получено {amount}'
  confirm:
    none: '&7Нет ожидающего обмена'
  rates:
    header: '&6Курсы валют'
    line: '&7 {pair}: &f{rate}'
    empty: '&7 Курсы не заданы (rates.yml)'
  nation:
    header: '&6Нация {nation}'
    not-in-nation: '&7 Ты не состоишь в нации'
  error:
    no-permission: '&cНедостаточно прав'
    unknown-currency: '&cВалюта {id} не найдена'
    player-not-found: '&cИгрок {name} не найден'
    invalid-amount: '&cНекорректная сумма: {value}'
    insufficient: '&cНедостаточно {symbol}: нужно {needed}, есть {balance}'
    self-pay: '&cНельзя перевести самому себе'
    storage: '&cОшибка хранилища, операция отменена'
    console-cannot-pay: '&cИз консоли платить нельзя'
    console-cannot-convert: '&cИз консоли обменивать нельзя'
    console-cannot-nation: '&cИз консоли нельзя смотреть нацию'
    towny-unavailable: '&cTowny не установлен или не загружен'
    balance-admin-only: '&cБаланс смотрят админы: /rv admin balance <ник>'
    rate-limited: '&7Слишком часто. Подожди пару секунд.'
    currency:
      exists: '&cВалюта {id} уже существует'
    convert:
      same-currency: '&cНельзя обменять валюту на саму себя'
      no-rate: '&cКурс {from} → {to} не задан'
      generic: '&cОбмен не выполнен: {reason}'
