name: RaskolVault Economy Guardian

on:
  pull_request:
    branches: [main]
    paths:
      - "src/main/java/dev/raskol/vault/api/**"
      - "src/main/java/dev/raskol/vault/wallet/**"
      - "src/main/java/dev/raskol/vault/storage/**"
      - "src/main/java/dev/raskol/vault/bank/**"
      - "src/main/java/dev/raskol/vault/auction/**"
      - "src/main/java/dev/raskol/vault/exchange/**"
      - "src/main/java/dev/raskol/vault/reserve/**"
      - "src/test/**"
      - "pom.xml"
      - ".github/workflows/economy-guardian.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  economy-regression:
    name: Economy regression tests (Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run full verification
        run: mvn -B clean verify
      - name: Verify sensitive changes include tests
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const sensitive = files.some(file =>
              /^src\/main\/java\/dev\/raskol\/vault\/(api|wallet|storage|bank|auction|exchange|reserve)\//.test(file.filename)
            );
            const tests = files.some(file => file.filename.startsWith("src/test/"));
            if (sensitive && !tests) {
              core.setFailed("Финансовые или storage-классы изменены без соответствующих тестов.");
            } else {
              core.info("Проверка тестового сопровождения изменений пройдена.");
            }
