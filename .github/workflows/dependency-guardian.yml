name: RaskolVault Dependency Guardian

on:
  pull_request:
    branches: [main]
    paths:
      - "pom.xml"
      - "**/pom.xml"
      - ".github/workflows/dependency-guardian.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency vulnerability review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
