name: RaskolVault Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raskol-vault-jar
          path: target/raskol-vault-*.jar
          if-no-files-found: error
          retention-days: 14
