name: Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build monorepo (core -> vault)
        run: mvn -B clean package

      - name: Upload RaskolVault jar
        uses: actions/upload-artifact@v4
        with:
          name: raskol-vault-1.0.0
          path: raskol-vault/target/raskol-vault-1.0.0.jar

      - name: Upload RaskolCore jar
        uses: actions/upload-artifact@v4
        with:
          name: raskol-core-1.3.0
          path: raskol-core/target/*.jar
